name: Bug report
description: A reproducible behavior or setup problem
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Expected and actual behavior. Do not include private data or credentials.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Commands and a self-authored case that can be shared publicly.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Node version, Case2Skill version, and Codex CLI version if relevant. Model IDs are optional; do not paste your config or authentication files.
